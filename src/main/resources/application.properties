spring.datasource.url=jdbc:postgresql://localhost:5432/aidir
spring.datasource.username=aidir
spring.datasource.password=aidir
spring.datasource.driver-class-name=org.postgresql.Driver
logging.level.org.springframework.web.filter.CommonsRequestLoggingFilter=DEBUG
server.port=8222

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=60MB

# The front end is ours and is expected to send exactly the shape a payload declares, so a field we do
# not know about is drift worth a 400 rather than something to discard quietly. VendorSubmissionPayload
# opts out of this with its own @JsonIgnoreProperties.
spring.jackson.deserialization.fail-on-unknown-properties=true

# uploads
# Paths in tool_submission_image_metadata are relative to this root, so it can move without a data migration.
aidir.uploads.root=${AIDIR_UPLOADS_ROOT:./uploads}
aidir.uploads.public-base-path=/media

# drupal
drupal.url=http://127.0.0.1:62371
drupal.user=admin
drupal.password=admin

# strapi
strapi.api.url=http://127.0.0.1:1337
strapi.api.token=6e137b5eb36eb64cf2baa6c17149493d315e70b81c5e5af47bb2cf7033b2c82ae5cb93eeef3a1a63f7ef6e45cc42c3393eb277a4e0b31f7c21b0d1bfc09a2d4f398187337e509e19bf1bde2dc127b06b124b8dc5aec8415b2d855e957e4d079e04a3bd681f0dcdd551f34636b732b7a8dee1f2c021dddf021816016970b82236

# directus
directus.api.url=http://127.0.0.1:8055
directus.api.token=aWSZHR0GnEJxyxjemBjRpQle-Vz3yGC2

# sessions
# Kept in Postgres by Spring Session JDBC, which is picked up from the classpath. Liquibase creates
# the spring_session tables, see 00000-init.sql.
spring.session.jdbc.initialize-schema=never
# The idle timeout of an ordinary session. Signing in with "Remember me" raises it for that session.
spring.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${aidir.session.cookie-secure}

# One switch for the Secure flag of both the session cookie and the XSRF-TOKEN cookie. A browser drops
# a Secure cookie it receives over plain HTTP, so a local run needs this off: the dev profile does
# that, and a local run without it sets AIDIR_SESSION_COOKIE_SECURE=false.
aidir.session.cookie-secure=${AIDIR_SESSION_COOKIE_SECURE:true}

# TLS terminates at the reverse proxy, so every request arrives here as plain HTTP. This makes Tomcat
# take the original scheme and client address from the X-Forwarded-* headers, which it trusts only
# from loopback and private-range addresses.
server.forward-headers-strategy=native

# liquibase
spring.liquibase.change-log=classpath:db/changelog/changelog.xml
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=none
