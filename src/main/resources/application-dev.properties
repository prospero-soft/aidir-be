# Active with SPRING_PROFILES_ACTIVE=dev. Every endpoint is open and CSRF is off (see SecurityConfig),
# so this must never be set on a server other people can reach.

# AdminBootstrap creates this account at startup.
aidir.admin.email=admin@aidir.test
aidir.admin.password=password

# Local development is plain HTTP, and a browser drops a Secure cookie it receives over it.
aidir.session.cookie-secure=false
